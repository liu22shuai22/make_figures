    <title>ERFlow · E-R 图工作台</title>
    <meta name="description" content="编辑实体、属性与联系基数，由后端排版生成 Chen 记法 E-R 图。" />
    <script>
      // 首帧之前定主题，避免深色用户看到闪一下的浅色
      try {
        var saved = localStorage.getItem('erflow-theme')
        document.documentElement.setAttribute('data-theme', saved === 'dark' ? 'dark' : 'light')
      } catch (e) {
        document.documentElement.setAttribute('data-theme', 'light')
      }
    </script>
